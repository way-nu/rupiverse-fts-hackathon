name: staging web app

# Every push to `staging` publishes the RupiVerse web app (mock mode: no backend,
# nothing leaves the browser) to GitHub Pages, so a ticket can be checked live
# before the owner merges it to master. Pushes to master deploy nothing.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          HUSKY: "0"
      - name: Serve from /<repo>/ on GitHub Pages
        run: node -e "const f='app.json';const d=require('./'+f);d.expo.experiments={...(d.expo.experiments||{}),baseUrl:'/${{ github.event.repository.name }}'};require('fs').writeFileSync(f,JSON.stringify(d,null,2))"
      - run: npx expo export -p web --output-dir dist
        env:
          EXPO_PUBLIC_API_MODE: mock
      - name: Deep links (/login, /home) fall back to the app
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
